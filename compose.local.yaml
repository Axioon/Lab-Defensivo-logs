services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
    logging:
      driver: json-file

  webapp:
    build: ./webapp
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      LAB_SECRET_KEY: "clave-temporal-laboratorio-local"
    logging:
      driver: json-file
